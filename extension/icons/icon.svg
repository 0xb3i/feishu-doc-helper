<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 无外层背景框：主体直接铺满画布，在 16px 工具栏里与相邻图标等大 -->
  <!-- 滑出的纯白文档卡片（带清晰炭黑描边，浅/暗工具栏均锐利） -->
  <path
    d="M23 24C23 15.1634 30.1634 8 39 8H89C97.8366 8 105 15.1634 105 24V72H23V24Z"
    fill="#FFFFFF"
    stroke="#1E1F24"
    stroke-width="7.5"
    stroke-linejoin="round"
  />
  <!-- 极简文档内容线 -->
  <rect x="37" y="31" width="27" height="7.5" rx="3.75" fill="#1E1F24" />
  <rect x="37" y="45" width="18" height="7.5" rx="3.75" fill="#9A9CA6" />
  <!-- 朱砂橘抓手圆点 -->
  <circle cx="85" cy="31" r="11" fill="#FF5A36" />
  <!-- 炭黑精密卡槽底座（铺满底部视觉重量） -->
  <rect x="6" y="60" width="116" height="62" rx="22" fill="#1E1F24" />
  <!-- 卡槽顶沿微亮开口线，突出卡片滑入感 -->
  <rect x="20" y="69" width="88" height="9" rx="4.5" fill="#FFFFFF" opacity="0.16" />
</svg>
