<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">飞书文档助手 — 飞书 / Lark 文档提取、粘贴与跨账号迁移扩展</title>
  <desc id="desc">Hero banner for Feishu Doc Helper Chrome extension illustrating the Extract, Cache, and Paste workflow for documents, images, and boards.</desc>

  <rect width="1200" height="330" rx="24" fill="#F4F8FB"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="23.5" fill="none" stroke="#D8E3EE"/>

  <!-- Left Title Block -->
  <g transform="translate(56 48)">
    <rect x="0" y="0" width="290" height="32" rx="16" fill="#E6F0FF" stroke="#BFD7FF"/>
    <circle cx="18" cy="16" r="5" fill="#1677FF"/>
    <text x="32" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#0958D9">MANIFEST V3 · NATIVE HOST</text>

    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="800" fill="#0F172A" letter-spacing="-1">飞书文档助手</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="500" fill="#334155">将文档迁移拆成「提取」与「粘贴」两步，支持飞书 / Lark</text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="500" fill="#334155">正文、批量图片与跨账号画板重建，不读取浏览器 Cookie。</text>

    <g transform="translate(0 206)">
      <rect x="0" y="0" width="128" height="36" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#0F172A">正文结构</text>

      <rect x="142" y="0" width="144" height="36" rx="9" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="160" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#0F172A">图片预览勾选</text>

      <rect x="300" y="0" width="150" height="36" rx="9" fill="#E6FFFA" stroke="#99F6E4"/>
      <text x="318" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" font-weight="600" fill="#0F766E">跨账号画板</text>
    </g>
  </g>

  <!-- Right Workflow Proof: Extract -> Cache -> Paste -->
  <g transform="translate(690 36)">
    <rect x="0" y="0" width="454" height="258" rx="18" fill="#FFFFFF" stroke="#D8E3EE"/>

    <!-- Source Doc -->
    <g transform="translate(24 22)">
      <rect x="0" y="0" width="406" height="56" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="14" y="14" width="28" height="28" rx="7" fill="#1677FF"/>
      <text x="23" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
      <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#0F172A">源文档 · 点击「提取文档」</text>
      <text x="54" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#64748B">提取正文、图片列表与 lark-cli 画板元数据</text>
    </g>

    <path d="M227 82 L227 96" stroke="#1677FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cache Bridge -->
    <g transform="translate(24 100)">
      <rect x="0" y="0" width="406" height="58" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
      <rect x="14" y="15" width="28" height="28" rx="7" fill="#0D9488"/>
      <text x="23" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
      <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#0F172A">扩展缓存区 · 跨账号中转</text>
      <text x="54" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#1E40AF">正文快照 + 图片勾选状态 + 画板占位信息</text>
    </g>

    <path d="M227 162 L227 176" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Target Doc -->
    <g transform="translate(24 180)">
      <rect x="0" y="0" width="406" height="56" rx="12" fill="#F0FDFA" stroke="#5EEAD4"/>
      <rect x="14" y="14" width="28" height="28" rx="7" fill="#0F172A"/>
      <text x="23" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
      <text x="54" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#0F172A">目标文档 · 点击「粘贴副本」</text>
      <text x="54" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#0F766E">恢复正文排版、图片与浏览器端重建画板</text>
    </g>
  </g>
</svg>
