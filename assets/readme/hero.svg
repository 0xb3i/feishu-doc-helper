<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">飞书文档助手</title>
  <desc id="desc">飞书文档助手：先提取，再粘贴，把飞书文档的正文、图片和画板搬到另一个账号。右侧示意一份文档从源文档复制到目标文档。</desc>

  <defs>
    <g id="doc">
      <rect width="168" height="208" rx="18" fill="#FFFFFF" stroke="#1E1F24" stroke-width="3"/>
      <rect x="24" y="28" width="76" height="10" rx="5" fill="#1E1F24"/>
      <rect x="24" y="50" width="120" height="7" rx="3.5" fill="#C9CAD1"/>
      <rect x="24" y="66" width="98" height="7" rx="3.5" fill="#C9CAD1"/>
      <rect x="24" y="88" width="120" height="50" rx="8" fill="#ECECEF"/>
      <path d="M32 130 L56 108 L74 122 L90 110 L136 130 Z" fill="#C9CAD1"/>
      <g fill="none" stroke="#9A9CA6" stroke-width="2">
        <rect x="24" y="152" width="34" height="24" rx="5"/>
        <rect x="110" y="152" width="34" height="24" rx="5"/>
        <path d="M58 164 H110"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="320" rx="24" fill="#F4F4F1"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="72" y="158" font-size="64" font-weight="700" letter-spacing="1" fill="#1E1F24">飞书文档助手</text>
    <text x="74" y="210" font-size="26" fill="#6E7079">先提取，再粘贴，</text>
    <text x="74" y="246" font-size="26" fill="#6E7079">把整篇文档搬到另一个账号</text>
  </g>

  <g id="transfer" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <use href="#doc" x="660" y="40"/>
    <use href="#doc" x="960" y="40"/>
    <path d="M840 120 C 880 88, 920 88, 948 112" fill="none" stroke="#1E1F24" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="M940 100 L950 114 L934 118" fill="none" stroke="#1E1F24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="895" cy="94" r="11" fill="#FF5A36"/>
    <text x="744" y="284" font-size="22" font-weight="600" fill="#1E1F24" text-anchor="middle">提取</text>
    <text x="1044" y="284" font-size="22" font-weight="600" fill="#1E1F24" text-anchor="middle">粘贴</text>
  </g>
</svg>
